name: restore-handoff-oneshot
on:
  workflow_dispatch:
  push:
    paths:
      - 'restore/handoff_chunk_00.b64'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and write HANDOFF.md
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, pathlib, zlib, hashlib
          parts=[]
          for i in range(8):
            p=pathlib.Path(f'restore/handoff_chunk_{i:02d}.b64')
            parts.append(p.read_text().strip())
          b64=''.join(parts)
          text=zlib.decompress(base64.b64decode(b64)).decode('utf-8')
          assert '### Live verify 0.29.0' in text
          assert 'PLACEHOLDER' not in text
          assert len(text)==56670
          pathlib.Path('HANDOFF.md').write_text(text, encoding='utf-8')
          print('wrote', len(text), hashlib.sha256(text.encode()).hexdigest())
          PY
      - name: Commit HANDOFF and remove oneshot transport
        run: |
          set -euo pipefail
          git config user.name "megabomb420"
          git config user.email "130213056+megabomb420@users.noreply.github.com"
          rm -rf restore
          rm -f .github/workflows/restore-handoff-oneshot.yml
          git add -A
          git status
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m "docs: live verify 0.29.0 (PWA browser pass)"
          git push origin HEAD:main
