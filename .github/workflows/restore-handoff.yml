name: restore-handoff
on:
  workflow_dispatch:
  push:
    paths:
      - 'restore/handoff_chunk_*.b64'
      - '.github/workflows/restore-handoff.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit HANDOFF.md
        run: |
          python3 - <<'PY'
          import zlib, base64, pathlib, glob
          parts = sorted(glob.glob('restore/handoff_chunk_*.b64'))
          assert len(parts) == 8, parts
          b64 = ''.join(pathlib.Path(p).read_text().strip() for p in parts)
          data = zlib.decompress(base64.b64decode(b64))
          pathlib.Path('HANDOFF.md').write_bytes(data)
          assert data.startswith(b'# Handoff')
          assert b'Live verify 0.27.1' in data
          print('restored', len(data), 'bytes')
          PY
          git config user.name "megabomb420"
          git config user.email "130213056+megabomb420@users.noreply.github.com"
          git add HANDOFF.md
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "docs: restore HANDOFF.md + live verify nested markers (0.27.1)"
            git push
          fi
